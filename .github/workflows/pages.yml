name: Deploy sample demo to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "sample_data/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Add sample data to demo
        run: |
          mkdir -p docs/sample_data
          cp sample_data/sample_annual_report.json docs/sample_data/sample_annual_report.json
      - name: Upload demo
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy demo
        id: deployment
        uses: actions/deploy-pages@v4
